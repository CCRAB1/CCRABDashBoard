name: ccrabdashboard_production

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DATABASE_NAME:?Set DATABASE_NAME for the production database}"
      POSTGRES_USER: "${DATABASE_USER:?Set DATABASE_USER for the production database}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD for the production database}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  web:
    build:
      context: .
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DJANGO_IN_DOCKER: "True"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS to your production hostnames}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY for production}"
      DATABASE_NAME: "${DATABASE_NAME:?Set DATABASE_NAME for the production database}"
      DATABASE_USER: "${DATABASE_USER:?Set DATABASE_USER for the production database}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD for the production database}"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DJANGO_WAIT_FOR_DB: "1"
      DJANGO_RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"
    volumes:
      - static_data:/app/staticfiles:rw
      - media_data:/app/media:rw
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: "${NGINX_SERVER_NAME:?Set NGINX_SERVER_NAME to your production hostnames}"
      CERTBOT_DOMAIN: "${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN to the primary Lets Encrypt certificate domain}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend

  certbot:
    image: certbot/certbot
    profiles:
      - certbot
    environment:
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:?Set CERTBOT_EMAIL for Lets Encrypt registration}"
      CERTBOT_DOMAIN: "${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN to the primary Lets Encrypt certificate domain}"
      CERTBOT_EXTRA_DOMAINS: "${CERTBOT_EXTRA_DOMAINS:-}"
      CERTBOT_EXTRA_ARGS: "${CERTBOT_EXTRA_ARGS:-}"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      nginx:
        condition: service_started
    entrypoint: /bin/sh
    command:
      - -c
      - >
        certbot certonly --webroot --webroot-path=/var/www/certbot
        --email "$${CERTBOT_EMAIL}"
        --agree-tos --no-eff-email --non-interactive --keep-until-expiring
        --cert-name "$${CERTBOT_DOMAIN}"
        -d "$${CERTBOT_DOMAIN}"
        $${CERTBOT_EXTRA_DOMAINS}
        $${CERTBOT_EXTRA_ARGS}
    networks:
      - backend

  certbot-standalone:
    image: certbot/certbot
    profiles:
      - certbot-standalone
    environment:
      CERTBOT_EMAIL: "${CERTBOT_EMAIL:?Set CERTBOT_EMAIL for Lets Encrypt registration}"
      CERTBOT_DOMAIN: "${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN to the primary Lets Encrypt certificate domain}"
      CERTBOT_EXTRA_DOMAINS: "${CERTBOT_EXTRA_DOMAINS:-}"
      CERTBOT_EXTRA_ARGS: "${CERTBOT_EXTRA_ARGS:-}"
    ports:
      - "80:80"
    volumes:
      - certbot_etc:/etc/letsencrypt
    entrypoint: /bin/sh
    command:
      - -c
      - >
        certbot certonly --standalone --preferred-challenges http
        --email "$${CERTBOT_EMAIL}"
        --agree-tos --no-eff-email --non-interactive --keep-until-expiring
        --cert-name "$${CERTBOT_DOMAIN}"
        -d "$${CERTBOT_DOMAIN}"
        $${CERTBOT_EXTRA_DOMAINS}
        $${CERTBOT_EXTRA_ARGS}
    networks:
      - backend

volumes:
  postgres_data:
  static_data:
  media_data:
  certbot_www:
  certbot_etc:

networks:
  backend:
