name: ccrabdashboard_production

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DATABASE_NAME:?Set DATABASE_NAME for the production database}"
      POSTGRES_USER: "${DATABASE_USER:?Set DATABASE_USER for the production database}"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD for the production database}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  web:
    build:
      context: .
    restart: unless-stopped
    environment:
      DJANGO_IN_DOCKER: "True"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS to your production hostnames}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY for production}"
      DATABASE_NAME: "${DATABASE_NAME:?Set DATABASE_NAME for the production database}"
      DATABASE_USER: "${DATABASE_USER:?Set DATABASE_USER for the production database}"
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?Set DATABASE_PASSWORD for the production database}"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DJANGO_WAIT_FOR_DB: "1"
      DJANGO_RUN_MIGRATIONS: "1"
      DJANGO_COLLECTSTATIC: "1"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 5).close()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      web:
        condition: service_healthy
    networks:
      - backend

  # CERTBOT
  certbot:
    image: certbot/certbot
    profiles:
      - certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email --staging -d example.com -d www.example.com
    networks:
      - backend

volumes:
  postgres_data:
  static_data:
  media_data:
  certbot_www:
  certbot_etc:

networks:
  backend:
